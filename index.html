<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Large, readable live captions for class, then notes shaped for a lecture, presentation, meeting or seminar. Made for students who are deaf or hard of hearing." />
    <meta name="apple-mobile-web-app-title" content="Hearing Assist" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Hearing Assist · Live captions and notes for class</title>
    <script>
      // Paint the saved appearance before the app loads, so dark mode never flashes white.
      try { document.documentElement.dataset.theme = localStorage.getItem('ha-theme') || 'light'; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
